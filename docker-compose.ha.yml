# Enzo Interiors: HA pre-prod, app side (docs/ha-preprod-plan.md, Phase 3).
#
# One copy of this file runs on EACH app VM (ha-app-1, ha-app-2), deployed from
# the `ha-preprod` branch. The data side (Postgres/Patroni, Redis, MinIO) is
# infra/ha/ and is NOT here. The apps talk to it through the local HAProxy,
# which finds the live primary, so every address below is just `haproxy`.
#
# Differences from docker-compose.yml, on purpose:
#  - No postgres / minio / redis / minio-init: they live on the data VMs.
#  - No Traefik labels and no published ports: the Cloudflare Tunnel
#    (`cloudflared`, tunnel enzo-ha, same token on both nodes) reaches the
#    services over this compose network. Nothing listens on the VM's address.
#  - `seed` is behind the `seed` profile and the API does not wait for it, so
#    only node 1 runs it (COMPOSE_PROFILES=seed there). The API image still runs
#    `prisma migrate deploy` on start on both nodes; Prisma takes a database
#    lock and migrations only ever add, so that is safe and needs no change.
#  - All mail goes to Mailpit; GOOGLE_* and VAPID_* are never passed (off).
#
# Change docker-compose.yml, docker-compose.preprod.yml and this file together
# when a service's environment changes.

name: enzo-ha

x-node-health: &node-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

x-data-urls: &data-urls
  DATABASE_URL: postgresql://${APP_DB_USER:-enzo}:${APP_DB_PASSWORD:?}@haproxy:5432/${APP_DB_NAME:-enzo}?schema=public
  S3_ENDPOINT: http://haproxy:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?the replicated MinIO service user}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-enzo-public}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-enzo-private}

services:
  # Finds the current Postgres primary, Redis master and a live MinIO.
  haproxy:
    image: haproxy:2.9-alpine
    restart: unless-stopped
    volumes:
      - ./infra/ha/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      DATA1_IP: ${DATA1_IP:?}
      DATA2_IP: ${DATA2_IP:?}
      LOCAL_DATA_IP: ${LOCAL_DATA_IP:?this node's data VM}
      REMOTE_DATA_IP: ${REMOTE_DATA_IP:?the other node's data VM}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  # Same token on both nodes: Cloudflare spreads visitors across the live ones.
  # Public hostnames (set in the Cloudflare dashboard) -> service:
  #   ha-web -> http://web:3000      ha-admin -> http://admin:80
  #   ha-portal -> http://portal:80  ha-api, ha-auth -> http://api:4000
  #   ha-media -> http://haproxy:9000
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?the enzo-ha tunnel token}

  api:
    image: enzo-ha-api:latest
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on: [haproxy]
    environment:
      <<: *data-urls
      NODE_ENV: production
      PORT: 4000
      # Identical on both nodes, or sessions and sealed tokens break across them.
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?prod's value, so 2FA secrets decrypt}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      CORS_ORIGINS: ${ADMIN_URL:?},${PORTAL_URL:?},${WEB_PUBLIC_URL:?}
      ADMIN_URL: ${ADMIN_URL}
      PORTAL_URL: ${PORTAL_URL}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?}
      # Shared Redis (through HAProxy): rate limits and the Socket.IO adapter.
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@haproxy:6379
      # cloudflared is the one hop in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TRUST_CLOUDFLARE: 'true'
      # Mail never leaves: Mailpit catches it. GOOGLE_* and VAPID_* stay unset.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAIL_FROM: ${MAIL_FROM:-Enzo HA test <no-reply@localhost>}
      ALERT_TO: ${ALERT_TO:-}
      ALERT_SHARED_SECRET: ${ALERT_SHARED_SECRET:-}
      RELEASE: ${SOURCE_COMMIT:-}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      # Must end in /<public bucket>: the API signs private downloads for this host.
      S3_PUBLIC_BASE_URL: ${MEDIA_BASE_URL:?e.g. https://ha-media.example/enzo-public}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *node-health

  # Node 1 only (COMPOSE_PROFILES=seed): schema, shipped images and copy.
  # By hand on either node: docker compose -f docker-compose.ha.yml --profile seed run --rm seed
  seed:
    profiles: ['seed']
    image: enzo-ha-seed:latest
    build:
      context: ./apps/api
      target: seed
      additional_contexts:
        webdata: ./apps/web/src/data
        seedmedia: ./apps/api/seed-media
    depends_on: [haproxy]
    environment:
      <<: *data-urls
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
    command:
      - sh
      - -c
      - |
        for try in 1 2 3; do
          timeout 300 npx prisma migrate deploy && timeout 900 npx tsx scripts/import-content.ts && exit 0
          echo "Content import: try $$try failed."; sleep 10
        done
        echo 'Content import FAILED three times. The API starts anyway; fix and redeploy.'
        exit 0
    restart: 'no'

  web:
    image: enzo-ha-web:latest
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:4000
        NEXT_PUBLIC_API_PUBLIC_URL: ${API_PUBLIC_URL:?}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_BASE_URL}
        SITE_URL: ${WEB_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_PUBLIC_URL: ${API_PUBLIC_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      SITE_URL: ${WEB_PUBLIC_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      ALERT_SHARED_SECRET: ${ALERT_SHARED_SECRET:-}
      CONTENT_REVALIDATE_SECONDS: ${CONTENT_REVALIDATE_SECONDS:-3600}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *node-health

  admin:
    image: enzo-ha-admin:latest
    build:
      context: ./apps/admin
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:?}
        VITE_WEB_URL: ${WEB_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  portal:
    image: enzo-ha-portal:latest
    build:
      context: ./apps/portal
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:?}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Catches every email, alert, digest and invite. UI on this VM's loopback
  # only (ssh -L 8025:127.0.0.1:8025). In memory: gone on restart, which is fine.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
