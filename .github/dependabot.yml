# Weekly update PRs into develop, one per app (minor and patch together, a major on its
# own), so a security fix is one small PR instead of a surprise. Dependabot reads this
# file from the default branch (main), so it starts when the release carrying it ships.
version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /apps/admin
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /apps/portal
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: npm
    directory: /apps/web
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  # The root pnpm-lock.yaml CI's lint step installs from.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    commit-message: { prefix: "chore(deps)" }
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "chore(ci)" }
