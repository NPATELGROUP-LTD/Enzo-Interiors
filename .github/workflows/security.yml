name: Security

on:
  pull_request:
  push:
    branches: [develop, main]
  # New advisories appear without a code change, so look again every Monday.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

# None of these are in CI's required checks (CLAUDE.md): a red one is a reason to look,
# not a lock on merging. All three are free on a private repository.
jobs:
  # Packages that ship with a known fault. Dev tools are left out: they never reach a server.
  # A new advisory can redden this with no code change, which is the point; Dependabot
  # (.github/dependabot.yml) opens the fix.
  audit:
    name: audit (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, web, portal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high --omit=dev
        working-directory: apps/${{ matrix.app }}

  # A key or password committed anywhere in the history. The CI workflow's own throwaway
  # test keys are allowed by path in .gitleaks.toml. The binary is pinned and checked.
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.18.4
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

  # Insecure code patterns (injection, unsafe redirects, weak crypto), high-confidence rules only.
  code:
    name: code (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.97.0
          semgrep scan --config p/ci --severity ERROR --error --metrics=off /src
