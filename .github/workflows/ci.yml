name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # Required check names: "app (api)", "app (admin)", "app (web)", "app (portal)".
  # Each app installs on its own (CLAUDE.md); a script an app does not define is skipped.
  app:
    name: app (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, admin, web, portal]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      # api/admin/portal have no eslint of their own: `eslint src` picks up the
      # root eslint.config.js and root node_modules/.bin. web's config is self-contained.
      - if: matrix.app != 'web'
        working-directory: .
        run: corepack enable && pnpm install --frozen-lockfile --filter .
      # Typecheck needs the generated client; do not rely on npm running postinstall.
      - if: matrix.app == 'api'
        run: npx prisma generate
      - run: npm run --if-present typecheck
      - run: npm run --if-present lint
      - run: npm run --if-present test
      - run: npm run --if-present build

  # The api booted against a real PostgreSQL (apps/api/src/test-support). Its own job so
  # the other matrix legs do not start a database; the DB name must end in _test.
  api-db:
    name: api (database tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enzo
          POSTGRES_PASSWORD: enzo
          POSTGRES_DB: enzo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enzo" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://enzo:enzo@localhost:5432/enzo_test?schema=public
      JWT_SECRET: ci-only-jwt-secret-not-for-anything-real
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:db

  # Image build smoke, PRs into main only. Context is each app's directory, as in docker-compose.yml.
  docker:
    name: docker (${{ matrix.app }})
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.app != 'web'
        run: docker build apps/${{ matrix.app }}
      # web reads these while prerendering, so it needs the same build args as
      # docker-compose.yml. Placeholder URLs: this is a build smoke, not a deploy.
      - if: matrix.app == 'web'
        run: >
          docker build apps/web
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://api:4000
          --build-arg NEXT_PUBLIC_API_PUBLIC_URL=https://api.example.test
          --build-arg NEXT_PUBLIC_MEDIA_BASE_URL=https://media.example.test
          --build-arg SITE_URL=https://www.example.test
