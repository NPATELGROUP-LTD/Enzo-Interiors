# Enzo Interiors — PRE-PROD stack. Self-contained: runs on any machine with Docker.
#
#   node scripts/preprod-env.mjs                 # once: writes .env.preprod with random secrets
#   docker compose --env-file .env.preprod -f docker-compose.preprod.yml up -d --build --wait
#
# To open it from a phone or another computer, give the machine's LAN address:
#   node scripts/preprod-env.mjs --host 192.168.1.20 --force
# (the web/admin/portal images bake these addresses in, so rebuild with --build).
#
# What makes it separate from docker-compose.yml (production/dev):
#   - its own project name, image tags, volumes and its own bridge network
#     (enzo-preprod-net, created by this file: no external `coolify` network, no Traefik);
#   - host ports are the usual ones + 10000, so both stacks can run side by side;
#   - its own env file (.env.preprod), every secret random, Google sign-in/calendar/mail off;
#   - mail goes to the bundled Mailpit: read it at http://<host>:18025, nothing leaves the machine.
#
# Wipe everything (database + uploads):
#   docker compose --env-file .env.preprod -f docker-compose.preprod.yml down --volumes
name: enzo-interiors-preprod

x-node-health: &node-health
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 45s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [preprod]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/preprod-env.mjs}
      POSTGRES_DB: ${POSTGRES_DB:-enzo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-enzo} -d ${POSTGRES_DB:-enzo}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Same pinned release as docker-compose.yml (MinIO stopped publishing images).
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    networks: [preprod]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?run node scripts/preprod-env.mjs}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?run node scripts/preprod-env.mjs}
    volumes:
      - minio-data:/bitnami/minio/data
    ports:
      # Browsers fetch images from here (MEDIA_BASE_URL), so it is open to the LAN.
      - '${MINIO_PORT:-19000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates both buckets; only the marketing one is public-read.
  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16
    networks: [preprod]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e &&
      until mc alias set enzo http://minio:9000 '${S3_ACCESS_KEY_ID}' '${S3_SECRET_ACCESS_KEY}'; do
        echo 'minio not ready, retrying...'; sleep 2;
      done &&
      mc mb --ignore-existing enzo/${S3_PUBLIC_BUCKET:-enzo-public} &&
      mc mb --ignore-existing enzo/${S3_PRIVATE_BUCKET:-enzo-private} &&
      mc anonymous set download enzo/${S3_PUBLIC_BUCKET:-enzo-public} &&
      echo 'Buckets ready.'
      "
    restart: 'no'

  # Rate-limit counters only; nothing to keep.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [preprod]
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends (sign-in codes, invites, enquiries). UI on :18025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    networks: [preprod]
    ports:
      - '${MAILPIT_PORT:-18025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025'

  api:
    image: enzo-interiors-preprod-api:latest
    build:
      context: ./apps/api
    restart: unless-stopped
    networks: [preprod]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Always exits 0, so a failed import never keeps the API down.
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-enzo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enzo}?schema=public
      JWT_SECRET: ${JWT_SECRET:?run node scripts/preprod-env.mjs}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      CORS_ORIGINS: ${ADMIN_URL},${PORTAL_URL},${WEB_PUBLIC_URL}
      ADMIN_URL: ${ADMIN_URL}
      PORTAL_URL: ${PORTAL_URL}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: 0
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?run node scripts/preprod-env.mjs}
      DISABLE_2FA: ${DISABLE_2FA:-}
      # Google is deliberately off here: unset = no Google buttons.
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:preprod@enzo.test}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAIL_FROM: ${MAIL_FROM:-Enzo Interiors (pre-prod) <no-reply@enzo.test>}
      ALERT_FROM: ''
      ALERT_TO: ${ALERT_TO:-}
      ALERT_SHARED_SECRET: ${ALERT_SHARED_SECRET:?run node scripts/preprod-env.mjs}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?run node scripts/preprod-env.mjs}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-enzo-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-enzo-private}
      S3_PUBLIC_BASE_URL: ${MEDIA_BASE_URL:?run node scripts/preprod-env.mjs}
    ports:
      - '${API_PORT:-14000}:4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *node-health

  # One-shot on every `up`: migrations, then the shipped content into the CMS.
  # Retries three times and always exits 0. By hand:
  #   docker compose --env-file .env.preprod -f docker-compose.preprod.yml run --rm seed
  seed:
    image: enzo-interiors-preprod-seed:latest
    build:
      context: ./apps/api
      target: seed
      additional_contexts:
        webdata: ./apps/web/src/data
        seedmedia: ./apps/api/seed-media
    networks: [preprod]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enzo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enzo}?schema=public
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-enzo-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-enzo-private}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
    command:
      - sh
      - -c
      - |
        for try in 1 2 3; do
          timeout 300 npx prisma migrate deploy && timeout 900 npx tsx scripts/import-content.ts && { timeout 300 npx tsx scripts/mock-data.ts seed || echo 'Mock data failed; the site still works.'; exit 0; }
          echo "Content import: try $$try failed."; sleep 10
        done
        echo 'Content import FAILED three times. The API starts anyway; fix and redeploy, or run the seed service by hand.'
        exit 0
    restart: 'no'

  web:
    image: enzo-interiors-preprod-web:latest
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:4000
        NEXT_PUBLIC_API_PUBLIC_URL: ${API_PUBLIC_URL:?run node scripts/preprod-env.mjs}
        NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_BASE_URL}
        SITE_URL: ${WEB_PUBLIC_URL}
    restart: unless-stopped
    networks: [preprod]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:4000
      NEXT_PUBLIC_API_PUBLIC_URL: ${API_PUBLIC_URL}
      NEXT_PUBLIC_MEDIA_BASE_URL: ${MEDIA_BASE_URL}
      SITE_URL: ${WEB_PUBLIC_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      ALERT_SHARED_SECRET: ${ALERT_SHARED_SECRET}
      CONTENT_REVALIDATE_SECONDS: ${CONTENT_REVALIDATE_SECONDS:-3600}
    ports:
      - '${WEB_PORT:-13000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      <<: *node-health

  admin:
    image: enzo-interiors-preprod-admin:latest
    build:
      context: ./apps/admin
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:?run node scripts/preprod-env.mjs}
        VITE_WEB_URL: ${WEB_PUBLIC_URL}
    restart: unless-stopped
    networks: [preprod]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    ports:
      - '${ADMIN_PORT:-15174}:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  portal:
    image: enzo-interiors-preprod-portal:latest
    build:
      context: ./apps/portal
      args:
        VITE_API_BASE_URL: ${API_PUBLIC_URL:?run node scripts/preprod-env.mjs}
    restart: unless-stopped
    networks: [preprod]
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL}
    ports:
      - '${PORTAL_PORT:-15175}:80'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  # Created and removed with the stack; nothing external to set up.
  preprod:
    name: enzo-preprod-net
    driver: bridge

volumes:
  postgres-data:
  minio-data:
