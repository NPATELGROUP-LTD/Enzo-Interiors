# Runs on each app VM (one per node), shared file. The apps keep one address
# per service (haproxy:5432 / :6379 / :9000) and this finds the live primary.
# Env (from the app VM): DATA1_IP DATA2_IP REDIS_PASSWORD PATRONI_REST_PASSWORD
# LOCAL_DATA_IP (this node's data VM) REMOTE_DATA_IP (the other one).
# No ports are published by the container; only the app network reaches it.
global
    log stdout format raw local0
    maxconn 1000

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 3s
    timeout client 30m
    timeout server 30m
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions

# Postgres: only the node Patroni says is primary answers 200 on /primary.
listen postgres
    bind :5432
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    server d1 "${DATA1_IP}":5432 check port 8008
    server d2 "${DATA2_IP}":5432 check port 8008

# Redis: only the master answers role:master.
listen redis
    bind :6379
    option tcp-check
    tcp-check connect
    tcp-check send "AUTH ${REDIS_PASSWORD}\r\n"
    tcp-check expect string +OK
    tcp-check send "INFO replication\r\n"
    tcp-check expect string role:master
    tcp-check send "QUIT\r\n"
    tcp-check expect string +OK
    server d1 "${DATA1_IP}":6379 check
    server d2 "${DATA2_IP}":6379 check

# Files: this node's MinIO first, the other only if it is down.
listen minio
    bind :9000
    option httpchk
    http-check send meth GET uri /minio/health/ready
    http-check expect status 200
    server local "${LOCAL_DATA_IP}":9000 check
    server remote "${REMOTE_DATA_IP}":9000 check backup
